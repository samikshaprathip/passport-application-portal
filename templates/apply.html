<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Passport Application</title>
    <style>
        /* General Body Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 40px;
            color: #333;
        }

        /* Container/Card Styling */
        .container {
            max-width: 700px;
            margin: auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            animation: fadeIn 0.5s ease-in-out;
        }

        h2 {
            text-align: center;
            color: #007BFF;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            font-size: 16px;
            color: #555;
            margin-bottom: 30px;
        }

        /* Form Styling */
        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-top: 15px;
            font-weight: 600;
        }

        input, select, textarea {
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            background-color: #f9f9f9;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #007BFF;
            outline: none;
            background-color: #fff;
        }

        textarea {
            resize: vertical;
        }

        /* Button Styling */
        button {
            margin-top: 25px;
            padding: 14px;
            background: #007BFF;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #0056b3;
        }

        /* Success Message */
        .success {
            text-align: center;
            color: green;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* Simple Fade Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Passport Application Form</h2>
        <p class="description">
            Please fill out the form below to apply for a new passport. Ensure that all details provided are accurate and complete before submission.
        </p>

        {% if success %}
            <p class="success">Your application has been submitted successfully!</p>
        {% endif %}

        <form method="POST">
            <label for="full_name">Full Name</label>
            <input type="text" id="full_name" name="full_name" required>

            <label for="date_of_birth">Date of Birth</label>
            <input type="date" id="date_of_birth" name="date_of_birth" required>

            <label for="gender">Gender</label>
            <select id="gender" name="gender" required>
                <option value="">--Select--</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>

            <label for="address">Address</label>
            <textarea id="address" name="address" rows="3" required></textarea>

            <label for="id_proof_number">ID Proof Number</label>
            <input type="text" id="id_proof_number" name="id_proof_number" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="application">Application Details</label>
            <textarea id="application" name="application" rows="4" required></textarea>

            <button type="submit">Submit Application</button>
        </form>
    </div>
</body>
</html>
